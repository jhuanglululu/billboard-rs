# Guest modules must export the shadow stack pointer: tasks share one linear
# memory and the host hands each new task its own stack region by writing this
# global. Without the export the plugin refuses to construct the instance, with
# an error naming this exact flag.
#
# It lives at the workspace root rather than in `demo/` because cargo reads
# `.cargo/config.toml` from the invocation directory upwards, and the demo is
# built from here (`cargo build --target wasm32-unknown-unknown -p demo`). An
# animation crate of its own copies this file to its own root.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=--export=__stack_pointer"]
