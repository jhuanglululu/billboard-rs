[package]
name = "billboard"
version.workspace = true
edition.workspace = true
# Copies the registry source ($BILLBOARD_REGISTRY, else the bundled snapshot)
# into OUT_DIR for `billboard::registry` to `include!`.
build = "build.rs"

[dependencies]
billboard-macros = { path = "../billboard-macros" }
# The guest core: tasks, sync, randomness, math, the panic hook and the host
# allocator. Shared with any other plugin built on the same engine, and the
# other half of a wire ABI this crate must move in lockstep with — hence a git
# dependency tracking the repo head rather than a published version.
wasmachine = { git = "https://github.com/jhuanglululu/wasmachine-rs" }
# `#[billboard::main]` expands into `wasmachine-macros`' entry-point machinery,
# re-exported from this crate so the generated attribute resolves in the
# animation's own crate.
wasmachine-macros = { git = "https://github.com/jhuanglululu/wasmachine-rs" }
# The channel payload guard: `Pod` is what makes "these bytes mean the same
# thing in another task's memory" a compile-time property, and it is what
# `Color` derives so it can cross a channel (the core's math types derive it
# over in `wasmachine`). Re-exported from the prelude, and by `payload!`, so
# animations never depend on bytemuck directly.
bytemuck = { version = "1", features = ["derive"] }
